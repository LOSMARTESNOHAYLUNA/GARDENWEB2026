/* === MEGA MENÚ SERVICIOS === */
.has-dd { position:static; }
.has-dd > a::after { content:' ▾'; font-size:10px; opacity:0.6; }
.dd-menu {
  position:fixed; left:0; right:0; top:64px;
  width:100%; display:flex; justify-content:center;
  background:var(--paper);
  border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft);
  box-shadow:0 16px 48px rgba(15,15,13,0.10);
  z-index:9999; opacity:0; pointer-events:none;
  transition:opacity 0.2s ease, transform 0.2s ease;
  transform:translateY(-8px);
}
.dd-menu.dd-open {
  opacity:1; pointer-events:all; transform:translateY(0);
}
.dd-inner { display:grid; grid-template-columns:repeat(5,190px); padding:28px 0; }
.dd-col { padding:0 20px; border-right:1px solid var(--line-soft); }
.dd-col:last-child { border-right:none; }
.dd-label { font-family:'Manrope'; font-size:9px; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:12px; font-weight:600; display:block; padding-bottom:8px; border-bottom:1px solid var(--line-soft); }
.dd-menu a { display:block; font-family:'Manrope'; font-size:13px; font-weight:300; color:var(--ink-soft); padding:5px 0; transition:color 0.2s; text-decoration:none !important; border-bottom:none !important; }
.dd-menu a:hover { color:var(--green); }

<script>
/* Mega menú — hover con retardo para que no desaparezca al mover el ratón */
(function(){
  var t, tr = document.querySelector('.has-dd'), m = document.querySelector('.dd-menu');
  if(!tr || !m) return;
  function show(){ clearTimeout(t); m.classList.add('dd-open'); }
  function hide(ms){ t = setTimeout(function(){ m.classList.remove('dd-open'); }, ms); }
  tr.addEventListener('mouseenter', show);
  tr.addEventListener('mouseleave', function(){ hide(350); });
  m.addEventListener('mouseenter', show);
  m.addEventListener('mouseleave', function(){ hide(150); });
  document.addEventListener('click', function(e){
    if(!tr.contains(e.target) && !m.contains(e.target)) m.classList.remove('dd-open');
  });
})();
</script>
<script>
/* Hamburger menu */
(function(){
  var toggle = document.querySelector('.menu-toggle');
  var nav    = document.querySelector('.nav');
  if(!toggle || !nav) return;
  toggle.addEventListener('click', function(e){
    e.stopPropagation();
    var open = nav.classList.toggle('open');
    toggle.textContent = open ? '✕' : '☰';
    toggle.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', function(e){
    if(nav.classList.contains('open') && !nav.contains(e.target) && !toggle.contains(e.target)){
      nav.classList.remove('open');
      toggle.textContent = '☰';
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
