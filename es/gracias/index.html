<style>
:root{--paper:#FBF8F2;--green:#1E4934;--gold:#9A7A35;--ink-soft:#2E2C28;--line-soft:#EAE3D2;--gray-soft:#6B6862;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Manrope',sans-serif;background:var(--paper);min-height:100vh;display:flex;flex-direction:column;}
.header{padding:20px 32px;background:rgba(251,248,242,0.97);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Montserrat';font-size:22px;color:var(--green);font-weight:600;text-decoration:none;}
.logo .it{color:var(--gold);font-weight:400;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;}
.card{max-width:540px;text-align:center;}
.check{width:72px;height:72px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;}
.check svg{stroke:white;}
h1{font-family:'Montserrat';font-size:clamp(28px,4vw,42px);color:var(--green);font-weight:600;margin-bottom:16px;}
h1 .it{color:var(--gold);font-weight:400;}
.sub{font-size:17px;font-weight:300;color:var(--ink-soft);line-height:1.7;margin-bottom:36px;}
.sub strong{font-weight:600;color:var(--green);}
.actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.btn{font-family:'Manrope';font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;padding:14px 28px;border-radius:100px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform 0.3s,box-shadow 0.3s;}
.btn-green{background:var(--green);color:var(--paper);}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(30,73,52,0.25);}
.btn-ghost{background:transparent;color:var(--green);border:1px solid var(--line-soft);}
.btn-ghost:hover{border-color:var(--green);}
.footer-note{padding:24px;text-align:center;font-family:'Manrope';font-size:13px;color:var(--gray-soft);border-top:1px solid var(--line-soft);}
.footer-note a{color:var(--green);}
@media(max-width:480px){.actions{flex-direction:column;align-items:center;}}
</style>
</head>
<body>
<header class="header">
  <a href="/es/" class="logo">Garden <span class="it">Solution</span></a>
</header>
<main class="main">
  <div class="card">
    <div class="check">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Mensaje enviado <span class="it">con éxito</span></h1>
    <p class="sub">Hemos recibido tu solicitud. <strong>Te respondemos en menos de 24 horas</strong> para confirmar disponibilidad y coordinar la visita técnica gratuita.</p>
    <div class="actions">
      <a href="/es/" class="btn btn-green">Volver al inicio</a>
      <a href="tel:+34621493977" class="btn btn-ghost">Llamar · 621 49 39 77</a>
    </div>
  </div>
</main>
<footer class="footer-note">
  Garden Solution Mallorca SL ·
  <a href="/es/politica-privacidad/">Privacidad</a> ·
  <a href="/es/aviso-legal/">Aviso legal</a>
</footer>
</body>
</html>
